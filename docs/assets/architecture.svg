<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Akashi architecture</title>
  <desc id="desc">Five planes process a pull request: intake, deterministic signals, LLM verification, deterministic admission, and posting. Only the posting plane holds credentials, and it never reads attacker-controlled input.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2328; }
      .title { font-size: 22px; font-weight: 600; }
      .subtitle { font-size: 13px; fill: #57606A; }
      .plane { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
      .name { font-size: 16px; font-weight: 600; }
      .item { font-size: 12px; fill: #424A53; }
      .strong { font-size: 12px; font-weight: 600; }
      .band { font-size: 12px; font-weight: 600; }
      .box { fill: #F6F8FA; stroke: #D0D7DE; stroke-width: 1.5; }
      .pill { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1.5; }
      .flow { stroke: #57606A; stroke-width: 1.5; fill: none; }
      .blue { fill: #0969DA; }
      .purple { fill: #8250DF; }
      .green { fill: #1A7F37; }
      .red { fill: #CF222E; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="520" rx="12" fill="#FFFFFF"/>

  <text x="40" y="44" class="title">Akashi</text>
  <text x="40" y="66" class="subtitle">Publish a security finding only when it can be proven.</text>

  <rect x="20" y="152" width="90" height="46" rx="23" class="pill"/>
  <text x="65" y="172" class="item" text-anchor="middle">Pull</text>
  <text x="65" y="188" class="item" text-anchor="middle">request</text>
  <line x1="110" y1="175" x2="128" y2="175" class="flow" marker-end="url(#arrow)"/>

  <rect x="130" y="100" width="175" height="150" rx="10" class="box"/>
  <rect x="130" y="100" width="175" height="6" rx="3" class="blue"/>
  <text x="146" y="128" class="plane blue">PLANE 0</text>
  <text x="146" y="150" class="name">Intake</text>
  <text x="146" y="180" class="item">Normalise the diff</text>
  <text x="146" y="200" class="item">pull_request trigger only</text>
  <text x="146" y="220" class="item">No LLM, no credentials</text>
  <line x1="305" y1="175" x2="323" y2="175" class="flow" marker-end="url(#arrow)"/>

  <rect x="325" y="100" width="175" height="150" rx="10" class="box"/>
  <rect x="325" y="100" width="175" height="6" rx="3" class="blue"/>
  <text x="341" y="128" class="plane blue">PLANE 1</text>
  <text x="341" y="150" class="name">Signals</text>
  <text x="341" y="180" class="item">ruff S · zizmor</text>
  <text x="341" y="200" class="item">uv audit · semgrep</text>
  <text x="341" y="220" class="item">Deterministic, under 3 s</text>
  <line x1="500" y1="175" x2="518" y2="175" class="flow" marker-end="url(#arrow)"/>

  <rect x="520" y="100" width="175" height="150" rx="10" class="box"/>
  <rect x="520" y="100" width="175" height="6" rx="3" class="purple"/>
  <text x="536" y="128" class="plane purple">PLANE 2</text>
  <text x="536" y="150" class="name">Verification</text>
  <text x="536" y="180" class="item">One LLM call per signal</text>
  <text x="536" y="200" class="item">New evidence, file:line</text>
  <text x="536" y="220" class="item">No credentials</text>
  <line x1="695" y1="175" x2="713" y2="175" class="flow" marker-end="url(#arrow)"/>

  <rect x="715" y="100" width="175" height="150" rx="10" class="box"/>
  <rect x="715" y="100" width="175" height="6" rx="3" class="blue"/>
  <text x="731" y="128" class="plane blue">PLANE 3</text>
  <text x="731" y="150" class="name">Admission</text>
  <text x="731" y="180" class="item">CVE alias dedup</text>
  <text x="731" y="200" class="item">Anchor check, evidence</text>
  <text x="731" y="220" class="item">No proof, no publication</text>
  <line x1="890" y1="175" x2="908" y2="175" class="flow" marker-end="url(#arrow)"/>

  <rect x="910" y="100" width="170" height="150" rx="10" class="box"/>
  <rect x="910" y="100" width="170" height="6" rx="3" class="green"/>
  <text x="926" y="128" class="plane green">PLANE 4</text>
  <text x="926" y="150" class="name">Posting</text>
  <text x="926" y="180" class="item">Per-PR token, 1 h</text>
  <text x="926" y="200" class="item">Validated JSON only</text>
  <text x="926" y="220" class="item">Never reads PR text</text>

  <path d="M412,250 L412,296" class="flow" marker-end="url(#arrow)"/>
  <rect x="322" y="298" width="180" height="40" rx="20" class="pill"/>
  <text x="412" y="323" class="item" text-anchor="middle">SARIF → code scanning</text>

  <path d="M607,250 L607,296" class="flow" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <rect x="520" y="298" width="175" height="62" rx="10" fill="#FFFFFF" stroke="#8250DF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="607" y="319" class="strong" text-anchor="middle">Witness sandbox</text>
  <text x="607" y="336" class="item" text-anchor="middle">base passes, head fails</text>
  <text x="607" y="352" class="item" text-anchor="middle">gated on testability</text>

  <path d="M995,250 L995,296" class="flow" marker-end="url(#arrow)"/>
  <rect x="935" y="298" width="120" height="40" rx="20" class="pill"/>
  <text x="995" y="323" class="item" text-anchor="middle">PR review</text>

  <line x1="900" y1="88" x2="900" y2="440" stroke="#CF222E" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="896" y="84" class="strong red" text-anchor="end">trust boundary</text>

  <rect x="130" y="392" width="760" height="40" rx="8" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1"/>
  <text x="510" y="417" class="band" text-anchor="middle">Reads attacker-controlled input · holds no credentials</text>
  <rect x="910" y="392" width="170" height="40" rx="8" fill="#DAFBE1" stroke="#4AC26B" stroke-width="1"/>
  <text x="995" y="417" class="band" text-anchor="middle">Holds credentials</text>

  <rect x="130" y="460" width="12" height="12" rx="3" class="blue"/>
  <text x="150" y="471" class="item">Deterministic, no model</text>
  <rect x="330" y="460" width="12" height="12" rx="3" class="purple"/>
  <text x="350" y="471" class="item">LLM, judges candidates only</text>
  <rect x="560" y="460" width="12" height="12" rx="3" class="green"/>
  <text x="580" y="471" class="item">Credentialed, no model</text>
  <text x="40" y="502" class="subtitle">Deterministic tools own recall. The LLM owns precision.</text>
</svg>
