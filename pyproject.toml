[project]
name = "akashi"
version = "0.1.0"
description = "Admission layer for security findings on pull requests: publish only what can be proven."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12",
    "pyright>=1.1.402",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pyyaml>=6.0.2",
    "ruff>=0.11.13",
    "types-pyyaml>=6.0.12",
    "zizmor>=1.32.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akashi"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "UP", "RUF", "S", "D"]
ignore = ["E501", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests", "evals"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov=akashi", "--cov=evals", "--cov-report=term-missing", "--cov-fail-under=90"]
markers = ["container: requires a container runtime"]
